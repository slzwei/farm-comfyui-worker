# ComfyUI model discovery on the RunPod network volume. The volume mounts at
# /runpod-volume on serverless workers; populate it once with
# scripts/download_models.sh.
runpod_volume:
  base_path: /runpod-volume/models
  diffusion_models: diffusion_models
  text_encoders: text_encoders
  vae: vae
  checkpoints: checkpoints
  loras: loras
